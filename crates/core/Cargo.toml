[package]
name = "zanrei-core"
version = "0.3.0"
edition = "2024"
description = "OS-independent core of Zanrei: detection, restore journal, settings."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3.27.0"
