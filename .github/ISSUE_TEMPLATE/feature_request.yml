name: Feature request
description: Suggest something new for Zanrei
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your proposal
    validations:
      required: true
  - type: textarea
    id: undo
    attributes:
      label: How can it be undone?
      description: If it changes the system, how is the original state restored?
