name: Bug report
description: Something did not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead? Include any error message verbatim.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Zanrei version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: "Windows 10 22H2, 64-bit"
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware (processor, memory, graphics card)
  - type: checkboxes
    id: restore
    attributes:
      label: Restore
      options:
        - label: The problem involves restore points or undo
