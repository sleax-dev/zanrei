[package]
name = "zanrei"
version = "0.6.2"
edition = "2024"
description = "Zanrei - Windows optimization with a mandatory undo."

[lib]
name = "zanrei_lib"

[features]
default = ["updater"]
# Off only for type-checking on hosts without a Windows C toolchain (the updater pulls in `ring`).
# The live user count (stats.rs) shares the updater's HTTP stack, so it comes with it.
updater = ["dep:tauri-plugin-updater", "dep:reqwest", "dep:rustls"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-os = "2.4.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = { version = "2.14.1", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
zanrei-core = { path = "../crates/core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[build-dependencies]
tauri-build = "2.7.4"

[dev-dependencies]
tempfile = "3.27.0"
